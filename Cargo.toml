[package]
name = "edgefirst-recorder"
description = "EdgeFirst MCAP Recorder"
authors = ["Au-Zone Technologies"]
repository = "https://github.com/EdgeFirstAI/recorder"
license = "Apache-2.0"
version = "1.11.0"
edition = "2021"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true

[dependencies]
anyhow = "1.0.104"
bus = "2.4.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
fs2 = "0.4.3"
hostname = "0.4.2"
libc = "0.2.189"
log = "0.4.34"
mcap = "0.25.0"
serde_json = "1.0.151"
signal-hook = "0.4.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "io-std"] }
zenoh = "1.10.1"

[[test]]
name = "env_scrub"
harness = false

[build-dependencies]
include_walk = "0.3.2"
