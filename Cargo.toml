[package]
name = "edgefirst-recorder"
description = "EdgeFirst MCAP Recorder"
authors = ["Au-Zone Technologies"]
repository = "https://github.com/EdgeFirstAI/recorder"
license = "Apache-2.0"
version = "1.10.0"
edition = "2021"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true

[dependencies]
anyhow = "1.0.102"
bus = "2.4.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.10"
fs2 = "0.4.3"
hostname = "0.4.2"
log = "0.4.29"
mcap = "0.24.0"
serde_json = "1.0.149"
signal-hook = "0.4.4"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "time", "io-std"] }
zenoh = "1.9.0"

[build-dependencies]
include_walk = "0.3.2"
