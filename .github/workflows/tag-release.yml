# Release chain step 2 of 3: a merged release/X.Y.Z pull request is tagged
# vX.Y.Z at the merge commit, only if release.yml is green for its head.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@9e296f92996b38683c684b9091ed59cb27562770  # v2.3.0
    permissions:
      contents: write       # create the tag
      actions: read         # require a green release.yml run
    with:
      require-build: release.yml
    secrets: inherit
