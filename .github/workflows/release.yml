# Release chain step 1 of 3: build every artifact the release ships on push to
# release/X.Y.Z. Nothing is published here; publish.yml attaches these
# artifacts to the GitHub Release when tag-release.yml tags the merge.

name: Release Build

on:
  push:
    branches: ['release/*.*.*']   # release/X.Y.Z and release/X.Y.Z-rcN
  workflow_dispatch:              # rebuild a release branch on demand

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true        # a fixup commit supersedes the build it interrupts

jobs:
  # Version against the branch name, the CHANGELOG section publish.yml needs,
  # and the full SBOM. The recorder ships binaries, not crates.
  verify:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@9f698bee471b68d231c39586af7b610f4080df09  # v2.0.0
    permissions:
      contents: read
    with:
      project-name: edgefirst-recorder
      sbom: true
      package-crates: false
    secrets: inherit

  # Linux binaries linked against glibc 2.17 (manylinux2014) with
  # cargo-zigbuild, so one binary runs on every supported distribution.
  build:
    needs: verify
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: EdgeFirstAI/.github/.github/actions/setup-rust@9f698bee471b68d231c39586af7b610f4080df09  # v2.0.0
        with:
          components: ""
          targets: ${{ matrix.target }}
          tools: cargo-zigbuild
          cache-key: release-${{ matrix.arch }}
          save-cache: "false"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cargo zigbuild --release --locked --target "$TARGET.2.17"
          mkdir -p dist
          cp "target/$TARGET/release/edgefirst-recorder" "dist/edgefirst-recorder-v$VERSION-linux-$ARCH"
          if [[ "$ARCH" == x86_64 ]]; then
            cp recorder.default dist/recorder.default
          fi
          file dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
